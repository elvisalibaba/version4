name: holistic_books
description: HolisticBooks mobile reader and publishing companion.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  go_router: ^18.0.2
  pdfx: ^2.11.0
  cached_network_image: ^3.4.1
  cryptography: 2.9.0
  google_fonts: ^6.3.2
  path_provider: 2.1.6
  shimmer: ^3.0.0
  supabase_flutter: 2.18.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: assets/brand/icon-blue.png
  adaptive_icon_background: "#F8F9FE"
  adaptive_icon_foreground: assets/brand/icon-blue.png
  adaptive_icon_foreground_inset: 24

flutter:
  uses-material-design: true
  assets:
    - assets/brand/icon-blue.png
    - assets/brand/icon-white.png
    - assets/brand/logo-light.png
