; HolisticBooks — pool PHP-FPM (VPS de 2 vCPU et 8 Go partagé avec d'autres services).
; 8 processus au plus : environ 80 à 120 Mo chacun avec Filament.
[www]
listen = 9000
pm = dynamic
pm.max_children = 8
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 3
pm.max_requests = 500
pm.status_path = /fpm-status
ping.path = /fpm-ping
request_terminate_timeout = 130s
catch_workers_output = yes
decorate_workers_output = no
clear_env = no
