name: HolisticBooks CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]

concurrency:
  group: holisticbooks-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          APP_BASE_URL: http://localhost:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          API_URL: http://127.0.0.1:8000

  backend:
    name: Laravel + Filament
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_sqlite, sqlite3, fileinfo, zip
          coverage: none

      - name: Validate Composer manifest
        working-directory: backend
        run: composer validate --no-check-lock

      - name: Install backend PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: PHP syntax
        working-directory: backend
        run: |
          find app routes config database tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Backend tests
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:Z3FBZHd2dXl6aWpLTktZcU92b0U4bE40V3pQZVZDUVI=
          APP_DEBUG: false
          DB_CONNECTION: sqlite
          DB_DATABASE: ":memory:"
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          EASYPAY_BASE_URL: https://payments.test
          EASYPAY_MODE: sandbox
          EASYPAY_CORRELATION_ID: test-cid
          EASYPAY_PUBLISHABLE_KEY: test-key
          FRONTEND_URL: http://localhost:3000
        run: |
          php artisan optimize:clear
          php artisan route:list
          php artisan test

      - name: Setup Node for Filament themes
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend frontend dependencies
        working-directory: backend
        run: npm install --no-audit --no-fund

      - name: Build Filament themes
        working-directory: backend
        run: npm run build


  backend-mysql:
    name: Laravel MySQL 8
    runs-on: ubuntu-latest
    timeout-minutes: 18
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: holisticbooks_test
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl, pdo_mysql, fileinfo, zip
          coverage: none

      - name: Install backend PHP dependencies
        working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Validate MySQL schema and tests
        working-directory: backend
        env:
          APP_ENV: testing
          APP_KEY: base64:Z3FBZHd2dXl6aWpLTktZcU92b0U4bE40V3pQZVZDUVI=
          APP_DEBUG: false
          DB_CONNECTION: mysql
          DB_HOST: 127.0.0.1
          DB_PORT: 3306
          DB_DATABASE: holisticbooks_test
          DB_USERNAME: root
          DB_PASSWORD: root
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
          MAIL_MAILER: array
          EASYPAY_BASE_URL: https://payments.test
          EASYPAY_MODE: sandbox
          EASYPAY_CORRELATION_ID: test-cid
          EASYPAY_TOKEN: test-token
          FRONTEND_URL: http://localhost:3000
        run: |
          php artisan optimize:clear

          php artisan migrate:fresh --force
          php artisan test



  mobile:
    name: Flutter mobile
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install mobile dependencies
        working-directory: mobile
        run: flutter pub get

      - name: Analyze mobile
        working-directory: mobile
        run: flutter analyze

      - name: Test mobile
        working-directory: mobile
        run: flutter test
