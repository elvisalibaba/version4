name: Production package

on:
  push:
    branches: [production]
  workflow_dispatch:

concurrency:
  group: production-package-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: Build Laravel cPanel dual ZIP
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_mysql, fileinfo, openssl, curl, intl, xml, zip
          coverage: none

      - name: Install production PHP dependencies
        working-directory: backend
        run: composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build Filament / Vite assets
        working-directory: backend
        run: |
          npm install --no-audit --no-fund
          npm run build
          php artisan filament:assets || true

      - name: Set release names
        run: |
          RELEASE_DATE="$(date -u +%Y-%m-%d)"
          echo "RELEASE_DATE=$RELEASE_DATE" >> "$GITHUB_ENV"
          echo "PRIVATE_ZIP=holisticbooks-api-production-publishing-platform-$RELEASE_DATE.zip" >> "$GITHUB_ENV"
          echo "PUBLIC_ZIP=holisticbooks-api-public-publishing-platform-$RELEASE_DATE.zip" >> "$GITHUB_ENV"

      - name: Prepare private Laravel package
        run: |
          mkdir -p release-private
          cp -a backend/. release-private/
          rm -rf release-private/node_modules
          rm -rf release-private/tests
          rm -rf release-private/.agents
          rm -rf release-private/.claude
          rm -f release-private/.env
          rm -f release-private/.phpunit.result.cache
          rm -f release-private/bootstrap/cache/*.php
          rm -rf release-private/storage/app/deploy release-private/storage/app/backups

          # Le cron cPanel (cpanel-cron.sh) déploie automatiquement dès que ce
          # fichier change : il suffit d'extraire le ZIP dans le Gestionnaire de fichiers.
          echo "${{ github.sha }}-${{ github.run_number }}" > release-private/RELEASE
          chmod 755 release-private/cpanel-cron.sh
          rm -rf release-private/storage/logs/*
          mkdir -p release-private/storage/logs
          mkdir -p release-private/storage/framework/cache/data
          mkdir -p release-private/storage/framework/sessions
          mkdir -p release-private/storage/framework/views
          mkdir -p release-private/storage/app/private/books/catalog
          mkdir -p release-private/storage/app/private/books/media
          mkdir -p release-private/storage/app/private/livewire-tmp
          mkdir -p release-private/storage/app/public/covers
          mkdir -p release-private/storage/app/public/livewire-tmp
          chmod -R ug+rwX release-private/storage release-private/bootstrap/cache || true

      - name: Prepare public api.aba.cd package
        run: |
          mkdir -p release-public
          cp -a backend/public/. release-public/

          # api.aba.cd lives in /home/<cpanel-user>/public_html/api.aba.cd
          # Laravel itself lives in /home/<cpanel-user>/holistic-api.
          # From the public document root, ../../holistic-api resolves to the private app.
          sed -i "s#__DIR__.'/../storage/#__DIR__.'/../../holistic-api/storage/#g" release-public/index.php
          sed -i "s#__DIR__.'/../vendor/#__DIR__.'/../../holistic-api/vendor/#g" release-public/index.php
          sed -i "s#__DIR__.'/../bootstrap/#__DIR__.'/../../holistic-api/bootstrap/#g" release-public/index.php

          grep -F "__DIR__.'/../../holistic-api/vendor/autoload.php'" release-public/index.php
          grep -F "__DIR__.'/../../holistic-api/bootstrap/app.php'" release-public/index.php

      - name: Create deployment archives
        run: |
          (
            cd release-private
            zip -r "../$PRIVATE_ZIP" . -x ".git/*" -x "*.DS_Store"
          )
          (
            cd release-public
            zip -r "../$PUBLIC_ZIP" . -x ".git/*" -x "*.DS_Store"
          )

          sha256sum "$PRIVATE_ZIP" > "$PRIVATE_ZIP.sha256"
          sha256sum "$PUBLIC_ZIP" > "$PUBLIC_ZIP.sha256"

      - name: Upload cPanel packages
        uses: actions/upload-artifact@v4
        with:
          name: holisticbooks-api-publishing-platform-${{ env.RELEASE_DATE }}
          path: |
            ${{ env.PRIVATE_ZIP }}
            ${{ env.PUBLIC_ZIP }}
            ${{ env.PRIVATE_ZIP }}.sha256
            ${{ env.PUBLIC_ZIP }}.sha256
          if-no-files-found: error
          retention-days: 30
