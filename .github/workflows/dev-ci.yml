name: Dev CI

on:
  push:
    branches: [dev]
  workflow_dispatch:

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      API_URL: http://127.0.0.1:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test
      - run: npm run build

  backend:
    name: Laravel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: testing
      APP_KEY: base64:Z3FBZHd2dXl6aWpLTktZcU92b0U4bE40V3pQZVZDUVI=
      DB_CONNECTION: sqlite
      DB_DATABASE: ":memory:"
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array
      EASYPAY_BASE_URL: https://payments.test
      EASYPAY_MODE: sandbox
      EASYPAY_CORRELATION_ID: test-cid
      EASYPAY_PUBLISHABLE_KEY: test-key
      FRONTEND_URL: http://localhost:3000
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, pdo_sqlite, fileinfo, openssl
          coverage: none
      - run: composer update --no-interaction --prefer-dist --no-progress
      - uses: actions/upload-artifact@v4
        with:
          name: composer-lock
          path: backend/composer.lock
          if-no-files-found: error
          retention-days: 1
      - run: php artisan optimize:clear
      - run: php artisan route:list
      - run: php artisan test
