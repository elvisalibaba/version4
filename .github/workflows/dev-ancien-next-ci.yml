name: HolisticBooks Supabase Migration CI

on:
  push:
    branches: [dev-ancien, fix/admin-supabase-dashboard, fix/book-review-covers-20261013, fix/supabase-free-reader-10-pages, fix/reviews-favorites-sharing-reader-20261013, fix/supabase-easypay-gateway-20261013, fix/covers-reader-browser-20261013, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: holisticbooks-supabase-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Next.js lint, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      APP_BASE_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
      API_URL: http://127.0.0.1:8000
      HOLISTIC_DATA_SOURCE: laravel
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Setup Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run test
      - run: npm run build
      - run: node scripts/check-guest-preview.mjs
      - name: Mobile and desktop browser smoke (real PDF rendering)
        if: github.ref == 'refs/heads/fix/covers-reader-browser-20261013'
        env:
          ALLOW_BROWSER_SMOKE: "1"
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install chromium webkit --with-deps
          node scripts/check-reader-browsers.mjs
      - name: Verify guest covers and reading on Vercel preview
        if: github.ref == 'refs/heads/main'
        env:
          HOLISTIC_PUBLIC_SMOKE_URL: https://www.holistique-books.com
        run: node scripts/check-public-cover-reader.mjs
